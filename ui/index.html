<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <base href="{{.Prefix}}/" />
  <title>Галерея</title>
  <!-- The styles and the script are inside the page: an iframe cannot put the account token on a
       <link> or a <script src>, and through the relay those requests are refused. -->
  <style>{{.Style}}</style>
</head>
<body data-write="{{.CanWrite}}">
  <header class="topbar">
    <div class="title">
      <span class="name" data-i18n="gallery">Галерея</span>
      <span class="muted" id="counter"></span>
    </div>

    <div class="tabs" role="tablist">
      <button type="button" class="text active" data-tab="pictures" data-i18n="pictures">Картинки</button>
      <button type="button" class="text" data-tab="articles" data-i18n="articles">Статьи</button>
    </div>

    <div class="actions">
      <select id="mode" class="sort" data-i18n-title="modeTitle" title="вид">
        <option value="compact" data-i18n="modeCompact">плотная</option>
        <option value="cards" data-i18n="modeCards">карточки</option>
      </select>
      <select id="sort" class="sort" data-i18n-title="sortTitle" title="порядок">
        <option value="new" data-i18n="sortNew">новые сверху</option>
        <option value="name" data-i18n="sortName">по имени</option>
      </select>
      <input type="search" id="search" class="search" data-i18n-placeholder="searchPlaceholder" placeholder="поиск по имени" />
      <button type="button" class="text" id="refresh" data-i18n="refresh">Обновить</button>
    </div>
  </header>

  <div class="notice" id="notice" hidden></div>

  <main id="scroller">
    <div class="cards" id="cards"></div>
    <!-- The table of contents of the memoirs, and one chapter on a page. -->
    <div class="toc" id="toc" hidden></div>
    <article class="story" id="story" hidden>
      <div class="story-bar">
        <button type="button" class="text back" id="storyBack">‹ <span data-i18n="backToArticles">к статьям</span></button>
        <span class="spacer"></span>
        <button type="button" class="text primary" id="storyEdit" data-i18n="editArticle">Редактировать</button>
      </div>
      <h1 id="storyTitle"></h1>
      <p class="story-meta" id="storyMeta"></p>
      <div class="story-body" id="storyBody"></div>
    </article>
    <div class="empty" id="empty" hidden></div>
    <!-- The sentinel lives inside the scrolling element: outside it never crosses anything and the
         next page is never asked for. -->
    <div id="sentinel"></div>
  </main>

  <footer class="foot"><span id="footInfo"></span></footer>

  <!-- The viewer: the whole picture, its name, and the arrows to walk the collection. -->
  <div class="viewer" id="viewer" hidden>
    <button type="button" class="viewer-close" id="viewerClose" title="Esc">×</button>
    <button type="button" class="viewer-nav prev" id="viewerPrev" title="←">‹</button>
    <figure>
      <div class="spinner" id="viewerSpinner" hidden></div>
      <img id="viewerImage" alt="" />
      <figcaption><span id="viewerName"></span></figcaption>
    </figure>
    <button type="button" class="viewer-nav next" id="viewerNext" title="→">›</button>
  </div>

  <!-- What a person wrote about the picture: the old gallery's fields, in the same place in the
       memory store. -->
  <dialog id="meta">
    <form id="metaForm" novalidate>
      <h2 id="metaTitle" data-i18n="metaTitle">Описание картинки</h2>
      <p class="muted" id="metaFile"></p>

      <div class="field">
        <div class="field-head">
          <span data-i18n="metaDescription">Описание</span>
          <button type="button" class="text small" id="metaDescribe" data-i18n="describeWithModel">Описать моделью</button>
        </div>
        <textarea id="fDescription" rows="5"></textarea>
      </div>
      <label class="field">
        <span data-i18n="metaTags">Теги (через запятую)</span>
        <input type="text" id="fTags" />
      </label>
      <label class="field">
        <span data-i18n="metaContext">Контекст</span>
        <input type="text" id="fContext" />
      </label>
      <label class="field">
        <span data-i18n="metaPrompt">Prompt генерации</span>
        <textarea id="fPrompt" rows="3"></textarea>
      </label>
      <label class="field">
        <span data-i18n="metaMemoir">Рассказ (имя файла)</span>
        <input type="text" id="fMemoir" />
      </label>

      <p class="error" id="metaError" hidden></p>
      <p class="hint" id="metaSaved" hidden></p>

      <div class="buttons">
        <button type="button" class="text danger" id="metaDelete" data-i18n="metaDelete">Удалить мету</button>
        <span class="spacer"></span>
        <button type="button" class="text" id="metaCancel" data-i18n="cancel">Отмена</button>
        <button type="submit" class="text primary" id="metaSave" data-i18n="save">Сохранить</button>
      </div>
    </form>
  </dialog>

  <!-- The editor of a chapter: the markdown as the file holds it. -->
  <dialog id="articleEditor">
    <form id="articleForm" novalidate>
      <h2 data-i18n="editArticle">Редактировать</h2>
      <p class="muted" id="articleFile"></p>
      <textarea id="articleText" class="source" spellcheck="false"></textarea>
      <p class="hint" data-i18n="articleHint">Markdown сохраняется в файл главы как есть; картинки достатточно указать именем файла: ![подпись](img_123.png).</p>
      <p class="error" id="articleError" hidden></p>
      <div class="buttons">
        <span class="spacer"></span>
        <button type="button" class="text" id="articleCancel" data-i18n="cancel">Отмена</button>
        <button type="submit" class="text primary" id="articleSave" data-i18n="save">Сохранить</button>
      </div>
    </form>
  </dialog>

  <script>{{.Script}}</script>
</body>
</html>
